[project]
name = "apub-repro"
version = "0.1.0"
description = "Reproduction of Minimizing Upper Confidence Bounds (arXiv 2403.08966)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
